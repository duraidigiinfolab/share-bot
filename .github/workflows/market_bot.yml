name: Share Market Bot Auto-Trader

on:
  schedule:
    # 03:15 UTC = 8:45 AM IST (15 min before market open — buffer for GitHub Actions delays)
    - cron: '15 3 * * 1-5'
    # 06:30 UTC = 12:00 PM IST (Midday target/SL check)
    - cron: '30 6 * * 1-5'
    # 10:30 UTC = 4:00 PM IST (30 min after market close — final report)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Which run to execute'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - midday
          - evening

permissions:
  contents: write

jobs:
  run-market-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Determine Run Type
        id: runtype
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ inputs.run_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 3 * * 1-5" ]; then
            echo "run_type=morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then
            echo "run_type=midday" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 10 * * 1-5" ]; then
            echo "run_type=evening" >> $GITHUB_OUTPUT
          else
            echo "run_type=morning" >> $GITHUB_OUTPUT
          fi

      - name: Run Morning Analysis (8:45 AM IST)
        if: steps.runtype.outputs.run_type == 'morning'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --morning

      - name: Run Midday Evaluation (12:00 PM IST)
        if: steps.runtype.outputs.run_type == 'midday'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --midday

      - name: Run Evening Evaluation (4:00 PM IST)
        if: steps.runtype.outputs.run_type == 'evening'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --evening

      - name: Save memory (tracker.json) back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add tracker.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update memory: tracker.json" && git push)
